services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gitcorpus
      POSTGRES_PASSWORD: gitcorpus
      POSTGRES_DB: gitcorpus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
