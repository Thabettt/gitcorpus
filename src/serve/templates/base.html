<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23141518'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1' fill='%232dd4bf'/%3E%3C/svg%3E">
<title>{% block title %}gitcorpus{% endblock %}</title>
<script>
(function () {
  "use strict";
  try {
    var stored = window.localStorage.getItem("gc-theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (error) {
    document.documentElement.removeAttribute("data-theme");
  }
})();
</script>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/rownav.js" defer></script>
<script src="/static/applib.js" defer></script>
<script src="/static/errors.js" defer></script>
<script src="/static/recentfilters.js" defer></script>
<script src="/static/modalfocus.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<div id="nav-progress" class="nav-progress" aria-hidden="true"></div>
<header class="site-header">
  <a class="brand" href="/">gitcorpus</a>
  {% set path = request.url.path %}
  <nav id="main-nav" class="site-nav" aria-label="Primary">
    <a href="/"{% if path == "/" %} aria-current="page"{% endif %}>Home</a>
    <a href="/runs"{% if path.startswith("/runs") %} aria-current="page"{% endif %}>Searches</a>
    <a href="/corpora"{% if path.startswith("/corpora") %} aria-current="page"{% endif %}>Corpora</a>
    <a href="/filters"{% if path.startswith("/filters") %} aria-current="page"{% endif %}>Library</a>
    <a href="/system"{% if path in ("/system", "/settings") %} aria-current="page"{% endif %}>System</a>
    <a href="/detections"{% if path.startswith("/detections") %} aria-current="page"{% endif %}>Detections</a>
  </nav>
  <a class="status-link" href="/system" aria-label="System status"><span hx-get="/partials/status-dot" hx-trigger="load, every 30s" hx-swap="outerHTML"></span></a>
  <button id="shortcuts-open" class="button ghost" type="button" data-open="shortcuts-modal" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
  <button id="theme-toggle" class="button ghost" type="button" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle dark mode">Theme</button>
</header>
<main id="content" class="content">
{% block body %}{% endblock %}
</main>
{% include "shortcuts.html" %}
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
