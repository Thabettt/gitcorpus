<span class="status-left">
  <span class="status-label"><span class="dot dot-{{ color }}" aria-hidden="true"></span> {{ label }}</span>
</span>
<span class="status-mid">
  <span class="sep" aria-hidden="true">·</span>
  <span>db <b class="st-{{ 'ok' if status.database else 'down' }}">{{ 'ok' if status.database else 'down' }}</b></span>
  <span class="sep" aria-hidden="true">·</span>
  <span>redis <b class="st-{{ 'ok' if status.redis else 'warn' }}">{{ 'ok' if status.redis else 'degraded' }}</b></span>
  <span class="sep" aria-hidden="true">·</span>
  <span>token <b class="st-{{ 'ok' if status.github_token_present else 'warn' }}">{{ 'ok' if status.github_token_present else 'missing' }}</b></span>
</span>
<span class="status-right">
  <span>v0.0.1</span>
  <span class="sep" aria-hidden="true">·</span>
  <a href="/system">system</a>
  <span class="sep" aria-hidden="true">·</span>
  <span>? help</span>
</span>
