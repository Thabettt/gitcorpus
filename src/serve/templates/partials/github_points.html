{% if percent is not none %}
<span class="progress-track" role="img" aria-label="{{ value_display }} of 5,000 GraphQL points remaining"><span class="progress-fill" style="width: {{ percent }}%"></span></span>
<span class="mono points-value">{{ value_display }} / 5,000 pts</span>
{% else %}
<span class="mono muted points-value">n/a</span>
{% endif %}
